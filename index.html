<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לקחתי\שכחתי?</title>
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="לקחתי?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#e6ebf1; --card:#f7f9fc; --card-done:#edf1f6; --text:#14202e; --muted:#5b6b7d; --line:#c9d3df;
  --head:#1d3557; --head-text:#eef3f9; --head-muted:#a9bdd6; --head-line:#3d5a80;
  --accent:#2f6fb0; --sky:#8ecae6; --on-sky:#0b2540;
  --danger:#b3261e; --miss:#c0392b; --miss-bg:#f6dcd9; --miss-text:#7a1f17;
  --ok-bg:#d6e6f5; --ok-text:#123a63; --bar:#c9d3df; --toast:#1d3557;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c131c; --card:#151f2b; --card-done:#111923; --text:#e3eaf2; --muted:#8fa1b5; --line:#263446;
    --head:#0a1018; --head-text:#e3eaf2; --head-muted:#8fa1b5; --head-line:#263446;
    --accent:#5fa3e0; --sky:#8ecae6; --on-sky:#0b2540;
    --danger:#ef6b62; --miss:#e0675c; --miss-bg:#3a1d1b; --miss-text:#f2b8b2;
    --ok-bg:#16304a; --ok-text:#b9d7f2; --bar:#263446; --toast:#22344c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c131c; --card:#151f2b; --card-done:#111923; --text:#e3eaf2; --muted:#8fa1b5; --line:#263446;
  --head:#0a1018; --head-text:#e3eaf2; --head-muted:#8fa1b5; --head-line:#263446;
  --accent:#5fa3e0; --sky:#8ecae6; --on-sky:#0b2540;
  --danger:#ef6b62; --miss:#e0675c; --miss-bg:#3a1d1b; --miss-text:#f2b8b2;
  --ok-bg:#16304a; --ok-text:#b9d7f2; --bar:#263446; --toast:#22344c; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-text);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
.top{display:flex;align-items:center;gap:6px}
.titles{flex:1;min-width:0}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 span{color:var(--sky)}
.hello{font-size:12px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{flex:none;width:34px;height:34px;border:1px solid var(--head-line);border-radius:6px;display:grid;place-items:center;color:var(--head-text)}
.hbtn .ic{width:18px;height:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:5px 11px;border-radius:4px;border:1px solid var(--head-line);font-size:13px;white-space:nowrap;color:var(--head-text)}
.tab.active{background:var(--sky);border-color:var(--sky);color:var(--on-sky);font-weight:600}
.tab.add{border-style:dashed;color:var(--head-muted)}

main{flex:1;padding:12px 12px 100px}
.status{padding:2px 4px 10px}
.status-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.status-row select{width:auto;max-width:55%;padding:5px 8px;font-size:13px;border-radius:4px;background:var(--card)}
.bar{height:6px;background:var(--bar);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.clear{color:var(--accent);font-size:13px;padding:6px 0 0}

ul{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-inline-start:4px solid var(--miss);padding:9px 10px;margin-bottom:6px}
.check{flex:none;width:26px;height:26px;border:2px solid var(--accent);border-radius:4px;display:grid;place-items:center;color:#fff}
.check .ic{width:16px;height:16px;stroke-width:3}
.item.done{background:var(--card-done);border-inline-start-color:var(--accent)}
.item.done .check{background:var(--accent)}
.body{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-weight:600;color:var(--text);margin-inline-end:4px}
.item.done .name{text-decoration:line-through;color:var(--muted);font-weight:400}
.tag{flex:none;font-size:11px;padding:2px 6px;border-radius:3px;background:var(--miss-bg);color:var(--miss-text);font-weight:600}
.item.done .tag{background:var(--ok-bg);color:var(--ok-text)}
.thumb{flex:none;width:38px;height:38px;border-radius:4px;object-fit:cover;background:var(--line)}
.link{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:2px;margin-inline-start:6px}
.link .ic{width:14px;height:14px}
.del{flex:none;width:30px;height:30px;color:var(--muted);display:grid;place-items:center}
.del .ic{width:16px;height:16px}
.section{font-size:12px;color:var(--muted);margin:16px 4px 8px;font-weight:600;letter-spacing:.3px}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .ic{width:44px;height:44px;stroke-width:1.5;color:var(--accent);margin-bottom:10px}

.addbar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--head);
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px}
.addbar input{flex:1;min-width:0;border-radius:4px;border-color:transparent}
.addbar .btn{background:var(--sky);color:var(--on-sky);border-radius:4px}
input[type=text],input[type=url],input:not([type]),textarea,select{width:100%;padding:11px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.btn{padding:11px 16px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.5}

.overlay{position:fixed;inset:0;background:rgba(5,12,22,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:14px 14px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h2{margin:0 0 12px;font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.menu-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.menu-list button>.ic{color:var(--accent)}
.menu-list small{display:block;color:var(--muted);font-size:12px}
.preset{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.preset small{color:var(--muted)}
.imgprev{display:flex;gap:10px;align-items:center;margin-top:6px}
.imgprev img{width:72px;height:72px;border-radius:6px;object-fit:cover}
.viewer{max-width:100%;max-height:70dvh;display:block;margin:0 auto 12px;border-radius:6px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 80px);inset-inline:16px;margin:auto;max-width:420px;z-index:30;
  background:var(--toast);color:#fff;border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{color:var(--sky);font-weight:700}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:6px 0 12px}
.welcome{text-align:center;padding:8px 0 4px}
.welcome .ic{width:48px;height:48px;stroke-width:1.5;color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="titles">
      <h1>לקחתי<span>\</span>שכחתי?</h1>
      <div class="hello" id="hello"></div>
    </div>
    <button class="hbtn" id="refreshBtn" aria-label="רענון"></button>
    <button class="hbtn" id="themeBtn" aria-label="מצב תצוגה"></button>
    <button class="hbtn" id="presetsBtn" aria-label="ניהול תבניות"></button>
    <button class="hbtn" id="menuBtn" aria-label="שיתוף, גיבוי והגדרות"></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="status">
    <div class="status-row">
      <span id="stats"></span>
      <select id="presetSelect" aria-label="טעינת תבנית"></select>
    </div>
    <div class="bar"><i id="barFill" style="width:0"></i></div>
    <button class="clear" id="clearDone" hidden>נקה פריטים שנלקחו</button>
  </div>
  <ul id="list"></ul>
</main>

<form class="addbar" id="addForm" autocomplete="off">
  <input id="addInput" placeholder="מה צריך לקחת?" enterkeyhint="done" aria-label="פריט חדש">
  <button class="btn" type="submit">הוסף</button>
</form>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'lakachti.v1', NAME_KEY = 'lakachti.name', THEME_KEY = 'lakachti.theme';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } };

/* ---------- icons (outline SVG) ---------- */
const P = {
  refresh:'<path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7-.7.7m0 11.4.7.7m-12.1-.7-.7.7"/>',
  moon:'<path d="M12 3h.393a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  bookmark:'<path d="M18 7v14l-6-4-6 4V7a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="m5 12 5 5L20 7"/>',
  link:'<path d="M9 15l6-6"/><path d="M11 6l.463-.536a5 5 0 0 1 7.071 7.072L18 13"/><path d="M13 18l-.397.534a5.068 5.068 0 0 1-7.127 0 4.972 4.972 0 0 1 0-7.071L6 11"/>',
  camera:'<path d="M5 7h1a2 2 0 0 0 2-2 1 1 0 0 1 1-1h6a1 1 0 0 1 1 1 2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2"/><circle cx="12" cy="13" r="3"/>',
  world:'<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/>',
  share:'<circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="m8.7 10.7 6.6-3.4M8.7 13.3l6.6 3.4"/>',
  message:'<path d="M8 9h8M8 13h6"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-5l-5 3v-3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>',
  upload:'<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v12"/>',
  download:'<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 11l5 5 5-5M12 4v12"/>',
  db:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.657 3.582 3 8 3s8-1.343 8-3V6"/><path d="M4 12v6c0 1.657 3.582 3 8 3s8-1.343 8-3v-6"/>',
  edit:'<path d="M4 20h4L18.5 9.5a2.828 2.828 0 1 0-4-4L4 16v4"/><path d="m13.5 6.5 4 4"/>',
  undo:'<path d="M9 14 5 10l4-4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  fileplus:'<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2zM12 11v6M9 14h6"/>',
  alert:'<path d="M12 9v4M12 16h.01"/><path d="M10.363 3.591 2.257 17.125a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636-2.87L13.637 3.59a1.914 1.914 0 0 0-3.274 0z"/>',
  user:'<circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>',
  plane:'<path d="M16 10h4a2 2 0 0 1 0 4h-4l-4 7H9l2-7H7l-2 2H2l2-4-2-4h3l2 2h4L9 3h3z"/>',
  clipboard:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
$('#refreshBtn').innerHTML = ic('refresh');
$('#presetsBtn').innerHTML = ic('bookmark');
$('#menuBtn').innerHTML = ic('dots');

/* ---------- state ---------- */
const DEFAULT_LIST = 'משימה';
function freshState(){
  const id = uid();
  return { version:1, activeListId:id, lists:[{ id, name:DEFAULT_LIST, items:[] }], presets:[] };
}
function load(){
  try{
    const s = JSON.parse(lsGet(KEY));
    if (s && Array.isArray(s.lists) && s.lists.length) { s.presets ||= []; return s; }
  }catch(e){}
  return freshState();
}
let state = load();
function save(){ if (!lsSet(KEY, JSON.stringify(state))) toast('שגיאה בשמירה — אין מספיק מקום'); }
const active = () => state.lists.find(l => l.id === state.activeListId) || state.lists[0];
if (navigator.storage?.persist) navigator.storage.persist().catch(()=>{});

/* ---------- user name ---------- */
let userName = lsGet(NAME_KEY) || '';
function renderHello(){ $('#hello').textContent = userName ? `שלום, ${userName}` : ''; }
function askName(first, then){
  openSheet(`<div class="welcome">${ic(first ? 'plane' : 'user')}</div>
    <h2 style="text-align:center">${first ? 'ברוכים הבאים' : 'שינוי שם'}</h2>
    <p class="hint" style="text-align:center">${first ? 'רשימת ציוד שנשמרת רק בטלפון שלך. איך קוראים לך?' : 'השם מוצג רק במכשיר הזה.'}</p>
    <div class="field"><input id="nName" value="${esc(userName)}" placeholder="השם שלך" maxlength="30" autocomplete="given-name"></div>
    <div class="row"><button class="btn" id="nSave">${first ? 'יאללה' : 'שמור'}</button>${first ? '' : '<button class="btn ghost" data-close>ביטול</button>'}</div>`, then);
  setTimeout(() => $('#nName')?.focus(), 50);
  $('#nSave').onclick = () => {
    const n = $('#nName').value.trim();
    if (!n){ $('#nName').focus(); return; }
    userName = n; lsSet(NAME_KEY, n); renderHello(); closeSheet();
  };
}

/* ---------- render ---------- */
function render(){
  const list = active();
  state.activeListId = list.id;
  $('#tabs').innerHTML = state.lists.map(l => {
    const left = l.items.filter(i => !i.checked).length;
    return `<button class="tab ${l.id===list.id?'active':''}" data-id="${l.id}">${esc(l.name)}${left?` · ${left}`:''}</button>`;
  }).join('') + `<button class="tab add" id="newListTab">+ רשימה</button>`;

  $('#presetSelect').innerHTML = `<option value="">${state.presets.length ? 'טען תבנית…' : 'אין תבניות'}</option>` +
    state.presets.map(p => `<option value="${p.id}">${esc(p.name)} (${p.items.length})</option>`).join('');
  $('#presetSelect').disabled = !state.presets.length;

  const todo = list.items.filter(i => !i.checked), done = list.items.filter(i => i.checked);
  const total = list.items.length;
  $('#stats').textContent = total ? `מוכנות: ${done.length}/${total}` : 'מוכנות: —';
  $('#barFill').style.width = total ? `${Math.round(done.length / total * 100)}%` : '0';
  $('#clearDone').hidden = !done.length;

  if (!total){
    $('#list').innerHTML = `<li class="empty">${ic('clipboard')}<div>הרשימה ריקה.</div><div>הוסיפו ציוד למטה או טענו תבנית.</div></li>`;
    return;
  }
  const row = i => `<li class="item ${i.checked?'done':''}" data-id="${i.id}">
      <button class="check" data-act="toggle" aria-label="${i.checked?'בטל סימון':'סמן שנלקח'}">${i.checked?ic('check'):''}</button>
      ${i.image?`<img class="thumb" src="${esc(i.image)}" alt="" data-act="img" loading="lazy">`:''}
      <div class="body" data-act="edit">
        <div class="name">${esc(i.name)}</div>
        ${(i.amount||i.note||i.link)?`<div class="meta">${i.amount?`<span class="amt">x${esc(i.amount)}</span>`:''}${i.amount&&i.note?' · ':''}${esc(i.note)}${i.link?`<a class="link" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${ic('link')}${esc(linkLabel(i.link))}</a>`:''}</div>`:''}
      </div>
      <span class="tag">${i.checked?'נלקח':'חסר'}</span>
      <button class="del" data-act="del" aria-label="מחק">${ic('x')}</button></li>`;
  $('#list').innerHTML = todo.map(row).join('') +
    (done.length ? `<li class="section">נלקח</li>` + done.map(row).join('') : '');
}
const commit = () => { save(); render(); };
const linkLabel = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'קישור'; } };
const cleanLink = u => { u = String(u||'').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; }catch(e){ return ''; } };
const cleanImage = s => { s = String(s||''); return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s) || /^https:\/\//.test(s) ? s : ''; };

/* resize photo to small JPEG so localStorage stays light */
function resizeImage(file, max = 480){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ---------- theme ---------- */
const themes = ['auto','light','dark'], themeIcon = { auto:'auto', light:'sun', dark:'moon' },
  themeName = { auto:'לפי המכשיר', light:'בהיר', dark:'כהה' };
function applyTheme(t){
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').innerHTML = ic(themeIcon[t]);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#0a1018' : '#1d3557';
}
let theme = lsGet(THEME_KEY) || 'auto';
applyTheme(theme);
$('#themeBtn').onclick = () => {
  theme = themes[(themes.indexOf(theme)+1) % 3];
  lsSet(THEME_KEY, theme); applyTheme(theme); toast('תצוגה: ' + themeName[theme]);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applyTheme(theme));

};

/* ---------- preset dropdown ---------- */
$('#presetSelect').onchange = e => {

/* ---------- items ---------- */
$('#addForm').addEventListener('submit', e => {

$('#list').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  const li = e.target.closest('.item'), list = active();
  const idx = list.items.findIndex(i => i.id === li.dataset.id), item = list.items[idx];
  if (act === 'toggle'){ item.checked = !item.checked; commit(); }
  if (act === 'del'){
    list.items.splice(idx, 1); commit();
    toast(`"${item.name}" נמחק`, 'בטל', () => { list.items.splice(idx, 0, item); commit(); });
  }

    openSheet(`<img class="viewer" src="${esc(item.image)}" alt=""><h2>${esc(item.name)}</h2>
      <div class="row"><button class="btn" id="vEdit">עריכה</button><button class="btn ghost" data-close>סגור</button></div>`);
    $('#vEdit').onclick = () => editItem(item);
  }
});

$('#clearDone').onclick = () => {
  const list = active(), before = list.items.slice();
  list.items = list.items.filter(i => !i.checked); commit();
  toast('נוקו פריטים שנלקחו', 'בטל', () => { list.items = before; commit(); });
};

function editItem(item){
  openSheet(`<h2>עריכת פריט</h2>
    <div class="field"><label>שם</label><input id="eName" value="${esc(item.name)}"></div>
    <div class="field"><label>כמות</label><input id="eAmt" value="${esc(item.amount)}" placeholder="למשל: 7, 2 זוגות"></div>
    <div class="field"><label>הערה</label><textarea id="eNote" placeholder="למשל: עם 2 לוחות, לבדוק סוללה">${esc(item.note)}</textarea></div>
    <div class="field"><label>קישור</label><input id="eLink" type="url" inputmode="url" dir="ltr" value="${esc(item.link||'')}" placeholder="https://..."></div>
    <div class="field"><label>תמונה</label>
      <div class="row"><button class="btn ghost small" id="eCam">${ic('camera')} צלם / בחר</button><button class="btn ghost small" id="eImgUrl">${ic('world')} מקישור</button></div>
      <div class="imgprev" id="ePrev"></div>
      <input type="file" id="eFile" accept="image/*" hidden></div>
    <div class="row"><button class="btn" id="eSave">שמור</button><button class="btn ghost" data-close>ביטול</button></div>`);
  let image = item.image || '';
  const prev = () => { $('#ePrev').innerHTML = image ? `<img src="${esc(image)}" alt=""><button class="btn ghost small" id="eRm">הסר תמונה</button>` : '';
    if (image) $('#eRm').onclick = () => { image = ''; prev(); }; };
  prev();
  $('#eCam').onclick = () => $('#eFile').click();
  $('#eFile').onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try{ image = await resizeImage(f); prev(); }catch(err){ toast('לא הצלחתי לטעון את התמונה'); } };
  $('#eImgUrl').onclick = () => { const u = prompt('כתובת התמונה (https://...):', /^https:/.test(image)?image:''); if (u == null) return;
    const c = cleanImage(u.trim()); if (!c){ toast('כתובת לא תקינה'); return; } image = c; prev(); };
  $('#eSave').onclick = () => {
    const link = $('#eLink').value.trim();
    if (link && !cleanLink(link)) return toast('קישור לא תקין');
    const old = { ...item };
    item.name = $('#eName').value.trim() || item.name;
    item.amount = $('#eAmt').value.trim();
    item.note = $('#eNote').value.trim();
    item.link = cleanLink(link);
    item.image = image;
    closeSheet();
    if (lsSet(KEY, JSON.stringify(state))) render();
    else { Object.assign(item, old); render(); toast('אין מספיק מקום בזיכרון — נסו תמונה קטנה יותר או מחקו תמונות'); }
  };
}

/* ---------- lists ---------- */
$('#tabs').addEventListener('click', e => {

function listMenu(){
  const list = active();
  openSheet(`<h2>${esc(list.name)}</h2><div class="menu-list">
    <button id="lmRename">${ic('edit')}<span>שינוי שם</span></button>
    <button id="lmUncheck">${ic('undo')}<span>סמן הכל כחסר<small>לתחילת משימה חדשה עם אותה רשימה</small></span></button>
    <button id="lmDelete">${ic('trash')}<span>מחק רשימה</span></button></div>`);

    closeSheet(); commit();
    toast(`"${list.name}" נמחקה`, 'בטל', () => { state.lists.splice(idx, 0, list); state.activeListId = list.id; commit(); });

}

/* ---------- presets ---------- */
const stripItems = items => items.map(({name, amount, note, link, image}) => ({ name, amount:amount||'', note:note||'', link:link||'', image:image||'' }));
function mergeInto(list, items){
  let added = 0;
  for (const p of items){
    const ex = list.items.find(i => i.name.trim() === p.name.trim());
    if (ex){ ex.checked = false; continue; }
    list.items.push({ id:uid(), name:p.name, amount:p.amount||'', note:p.note||'', link:p.link||'', image:p.image||'', checked:false, createdAt:Date.now() });
    added++;
  }
  return added;
}

$('#presetsBtn').onclick = presetsSheet;
function presetsSheet(){
  const list = active();
  openSheet(`<h2>תבניות</h2>
    <p class="hint">תבנית = רשימת ציוד קבועה (למשל "יציאה לשטח") שאפשר לטעון בלחיצה מהתפריט הנפתח.</p>
    <button class="btn" id="pSave" style="width:100%;margin-bottom:14px" ${list.items.length?'':'disabled'}>${ic('bookmark')} שמור את "${esc(list.name)}" כתבנית</button>
    ${state.presets.length ? state.presets.map(p => `<div class="preset" data-id="${p.id}">
        <div class="body"><div class="name">${esc(p.name)}</div><small>${p.items.length} פריטים</small></div>
        <button class="btn small" data-pact="load">טען</button>
        <button class="del" data-pact="del" aria-label="מחק">${ic('x')}</button></div>`).join('')
      : `<p class="hint" style="text-align:center;padding:16px">אין תבניות עדיין</p>`}`);
  $('#pSave').onclick = () => {
    const name = prompt('שם התבנית:', list.name); if (!name?.trim()) return;
    const ex = state.presets.find(p => p.name === name.trim());
    if (ex){ if (!confirm('קיימת תבנית בשם הזה. להחליף?')) return; ex.items = stripItems(list.items); }
    else state.presets.push({ id:uid(), name:name.trim(), items:stripItems(list.items) });
    commit(); presetsSheet(); toast('התבנית נשמרה');
  };
  $('#sheet').querySelectorAll('[data-pact]').forEach(b => b.onclick = () => {
    const p = state.presets.find(x => x.id === b.closest('.preset').dataset.id);
    if (b.dataset.pact === 'del'){
      if (!confirm(`למחוק את התבנית "${p.name}"?`)) return;
      state.presets = state.presets.filter(x => x !== p); commit(); presetsSheet();
    } else loadPreset(p);
  });
}
function loadPreset(p){
  const list = active();
  if (!list.items.length){ mergeInto(list, p.items); closeSheet(); commit(); return toast(`נטענה "${p.name}"`); }
  openSheet(`<h2>טעינת "${esc(p.name)}"</h2><div class="menu-list">
    <button id="plMerge">${ic('plus')}<span>הוסף לרשימה הנוכחית<small>פריטים קיימים לא יוכפלו</small></span></button>
    <button id="plReplace">${ic('refresh')}<span>החלף את הרשימה הנוכחית</span></button>
    <button id="plNew">${ic('fileplus')}<span>פתח כרשימה חדשה</span></button></div>`);
  $('#plMerge').onclick = () => { const n = mergeInto(list, p.items); closeSheet(); commit(); toast(`נוספו ${n} פריטים`); };
  $('#plReplace').onclick = () => { const before = list.items; list.items = []; mergeInto(list, p.items); closeSheet(); commit();
    toast('הרשימה הוחלפה', 'בטל', () => { list.items = before; commit(); }); };
  $('#plNew').onclick = () => { const id = uid(), nl = { id, name:p.name, items:[] }; mergeInto(nl, p.items);
    state.lists.push(nl); state.activeListId = id; closeSheet(); commit(); };
}

/* ---------- export / import / share ---------- */
const b64url = bytes => { let s=''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64url = str => Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
async function pipe(bytes, Stream){
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream('deflate-raw'))).arrayBuffer());
}
async function encodeShare(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window){ try{ return 'z' + b64url(await pipe(raw, CompressionStream)); }catch(e){} }
  return 'j' + b64url(raw);
}
async function decodeShare(code){
  let bytes = unb64url(code.slice(1));
  if (code[0] === 'z') bytes = await pipe(bytes, DecompressionStream);
  return JSON.parse(new TextDecoder().decode(bytes));
}
const listPayload = l => ({ app:'lakachti', type:'list', version:1, name:l.name, items:stripItems(l.items) });
const backupPayload = () => ({ app:'lakachti', type:'backup', version:1, exportedAt:new Date().toISOString(), lists:state.lists, presets:state.presets });
const appUrl = () => location.href.split('#')[0];
const listText = l => `רשימת ציוד: ${l.name}\n` + l.items.filter(i=>!i.checked).map(i =>
  `☐ ${i.name}${i.amount?` x${i.amount}`:''}${i.note?` – ${i.note}`:''}${i.link?` ${i.link}`:''}`).join('\n');

function download(obj, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('הועתק'); }
  catch(e){ prompt('העתיקו:', text); }
}
const safeName = s => s.replace(/[\\/:*?"<>|]+/g,'_');

$('#menuBtn').onclick = () => {
  const l = active();
  openSheet(`<h2>שיתוף, גיבוי והגדרות</h2>
    <div class="section" style="margin-top:0">הרשימה "${esc(l.name)}"</div>
    <div class="menu-list">
      <button id="mLink">${ic('share')}<span>שתף קישור<small>מי שפותח מקבל עותק של הרשימה</small></span></button>
      <button id="mText">${ic('message')}<span>שתף כטקסט<small>לוואטסאפ, רק מה שעוד חסר</small></span></button>
      <button id="mFile">${ic('upload')}<span>ייצוא לקובץ</span></button>
    </div>
    <div class="section">ייבוא</div>
    <div class="menu-list">
      <button id="mImport">${ic('download')}<span>ייבוא מקובץ<small>רשימה או גיבוי מלא</small></span></button>
    </div>
    <div class="section">כל הנתונים</div>
    <div class="menu-list">
      <button id="mBackup">${ic('db')}<span>גיבוי מלא לקובץ<small>כל הרשימות והתבניות</small></span></button>
      <button id="mName">${ic('user')}<span>שינוי שם<small>${userName ? esc(userName) : 'לא הוגדר'}</small></span></button>
    </div>
    <p class="hint">הנתונים נשמרים רק בדפדפן במכשיר הזה. מומלץ להוסיף את האפליקציה למסך הבית ולגבות מדי פעם.</p>`);
  $('#mLink').onclick = async () => {
    const payload = listPayload(l);
    const hadPhotos = payload.items.some(i => i.image.startsWith('data:'));
    payload.items.forEach(i => { if (i.image.startsWith('data:')) i.image = ''; }); // photos too big for a link
    const url = appUrl() + '#import=' + await encodeShare(payload);
    if (hadPhotos) toast('תמונות מהמצלמה לא נכללות בקישור — השתמשו ב"ייצוא לקובץ"');
    if (navigator.share){ try{ await navigator.share({ title:l.name, text:`רשימת ציוד: ${l.name}`, url }); return; }catch(e){ if (e.name==='AbortError') return; } }
    copy(url);
  };
  $('#mText').onclick = async () => {
    const text = listText(l);
    if (navigator.share){ try{ await navigator.share({ text }); return; }catch(e){ if (e.name==='AbortError') return; } }
    copy(text);
  };
  $('#mFile').onclick = async () => {
    const obj = listPayload(l), name = `${safeName(l.name)}.json`;
    const file = new File([JSON.stringify(obj, null, 2)], name, {type:'application/json'});
    if (navigator.canShare?.({ files:[file] })){ try{ await navigator.share({ files:[file], title:l.name }); return; }catch(e){ if (e.name==='AbortError') return; } }
    download(obj, name);
  };
  $('#mBackup').onclick = () => download(backupPayload(), `lakachti-backup-${new Date().toISOString().slice(0,10)}.json`);
  $('#mImport').onclick = () => $('#fileInput').click();
  $('#mName').onclick = () => askName(false);
};

$('#fileInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try{ handleImport(JSON.parse(await f.text())); }
  catch(err){ closeSheet(); toast('הקובץ לא תקין'); }
};

function validItems(items){
  if (!Array.isArray(items)) throw 0;
  return items.filter(i => i && typeof i.name === 'string' && i.name.trim())
    .map(i => ({ name:i.name.trim().slice(0,200), amount:String(i.amount||'').slice(0,100), note:String(i.note||'').slice(0,500),
      link:cleanLink(i.link), image:cleanImage(i.image) }));
}
function handleImport(obj){
  if (!obj || obj.app !== 'lakachti') throw new Error('bad');
  if (obj.type === 'backup'){
    if (!Array.isArray(obj.lists)) throw new Error('bad');
    openSheet(`<h2>שחזור גיבוי</h2>
      <p>${obj.lists.length} רשימות, ${(obj.presets||[]).length} תבניות.</p><div class="menu-list">
      <button id="bMerge">${ic('plus')}<span>הוסף לנתונים הקיימים</span></button>
      <button id="bReplace">${ic('alert')}<span>החלף הכל<small>הנתונים הנוכחיים יימחקו</small></span></button></div>
      <button class="btn ghost" data-close style="width:100%">ביטול</button>`);
    const build = () => ({
      lists: obj.lists.map(l => { const nl = { id:uid(), name:String(l.name||'רשימה'), items:[] }; mergeInto(nl, validItems(l.items));
        (l.items||[]).forEach(src => { const it = nl.items.find(x => x.name === String(src?.name||'').trim()); if (it && src.checked) it.checked = true; }); return nl; }),
      presets: (obj.presets||[]).map(p => ({ id:uid(), name:String(p.name||'תבנית'), items:validItems(p.items) }))
    });
    $('#bMerge').onclick = () => { const b = build(); state.lists.push(...b.lists); state.presets.push(...b.presets); closeSheet(); commit(); toast('הגיבוי נוסף'); };
    $('#bReplace').onclick = () => { if (!confirm('למחוק את כל הנתונים הנוכחיים ולהחליף בגיבוי?')) return;
      const b = build(); if (!b.lists.length) b.lists = freshState().lists;
      state = { version:1, activeListId:b.lists[0].id, lists:b.lists, presets:b.presets }; closeSheet(); commit(); toast('הגיבוי שוחזר'); };
    return;
  }
  if (obj.type !== 'list') throw new Error('bad');
  const items = validItems(obj.items), name = String(obj.name || 'רשימה משותפת').slice(0,60);
  openSheet(`<h2>התקבלה רשימה</h2>
    <p><b>${esc(name)}</b> · ${items.length} פריטים</p>
    <p class="hint">${items.slice(0,8).map(i => esc(i.name)).join(', ')}${items.length>8?'…':''}</p>
    <div class="menu-list">
      <button id="iNew">${ic('fileplus')}<span>שמור כרשימה חדשה</span></button>
      <button id="iMerge">${ic('plus')}<span>הוסף לרשימה "${esc(active().name)}"</span></button>
      <button id="iPreset">${ic('bookmark')}<span>שמור כתבנית</span></button></div>
    <button class="btn ghost" data-close style="width:100%">ביטול</button>`);
  $('#iNew').onclick = () => { const nl = { id:uid(), name, items:[] }; mergeInto(nl, items); state.lists.push(nl); state.activeListId = nl.id; closeSheet(); commit(); toast('הרשימה נשמרה'); };
  $('#iMerge').onclick = () => { const n = mergeInto(active(), items); closeSheet(); commit(); toast(`נוספו ${n} פריטים`); };
  $('#iPreset').onclick = () => { state.presets.push({ id:uid(), name, items }); closeSheet(); commit(); toast('נשמר כתבנית'); };
}

async function checkHashImport(){
  const m = location.hash.match(/^#import=(.+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try{ handleImport(await decodeShare(m[1])); }
  catch(e){ toast('הקישור לא תקין'); }
}
window.addEventListener('hashchange', checkHashImport);

/* ---------- sheet + toast ---------- */
let afterClose = null;
function openSheet(html, onClose){ afterClose = onClose || null; $('#sheet').innerHTML = html; $('#overlay').classList.add('open'); }
function closeSheet(){
  $('#overlay').classList.remove('open'); $('#sheet').innerHTML = '';
  const f = afterClose; afterClose = null; f?.();
}
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay' || e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) closeSheet();
  if (e.key === 'Enter' && e.target.matches('.sheet input')){ e.preventDefault(); $('#sheet .btn:not(.ghost)')?.click(); }
});
let toastTimer;
function toast(msg, btn, fn){
  $('#toastMsg').textContent = msg;
  const b = $('#toastBtn'); b.textContent = btn || ''; b.hidden = !btn;
  b.onclick = () => { fn?.(); $('#toast').classList.remove('show'); };
  $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), btn ? 5000 : 2200);
}

/* sync between tabs */
window.addEventListener('storage', e => {
  if (e.key === KEY){ state = load(); render(); }
  if (e.key === NAME_KEY){ userName = e.newValue || ''; renderHello(); }
});

render();
renderHello();
if (!userName) askName(true, checkHashImport); else checkHashImport();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
